name: Feature request
description: Something you'd like the status line or the side pane to show or do.
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: Thanks for the idea! English or French, both are fine.
  - type: textarea
    id: need
    attributes:
      label: What you'd like
      description: What you want to see or do, and why it matters to you.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where it would go
      description: Status line, side pane (which box), settings, a command…
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else
      description: Workarounds you use today, other tools that do it, mockups.
    validations:
      required: false
